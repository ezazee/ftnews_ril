<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iklan Stag</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            padding: 20px;
            width: 80%;
            max-width: 400px;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .view {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .view h2 {
            margin-bottom: 10px;
            color: #333;
        }
        .view img {
            max-width: 100%;
            height: auto;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .view figcaption {
            text-align: center;
            margin-top: 10px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="view">
            <img src="https://placehold.co/728x90" alt="">
            <img src="https://placehold.co/160x600" alt="">
            <img src="https://placehold.co/1008x280" alt="">
        </div>
        <div class="view">
            <img src="https://placehold.co/320x50" alt="">
            <img src="https://placehold.co/320x250" alt="">
            <img src="https://placehold.co/565x192" alt="">
            <img src="https://placehold.co/400x333" alt="">
            <img src="https://placehold.co/400x250" alt="">
        </div>
    </div>
</body>
</html>
